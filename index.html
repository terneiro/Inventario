<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Inventário — Contagem de Estoque</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#0d0f14; --panel:#151922; --panel2:#1c212c; --line:#28303e;
  --tx:#e9edf4; --mut:#8d97a8; --acc:#e02b45; --acc2:#ff4d68;
  --ok:#12b981; --warn:#f59e0b; --blue:#3b82f6;
  --r:14px; --safe: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx); overscroll-behavior:none;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
}
button,input,select,textarea{font:inherit;color:inherit}
/* iOS dá zoom sozinho em qualquer campo com fonte menor que 16px:
   no meio da contagem isso desloca a tela inteira a cada toque.
   Precisa vir depois do font:inherit acima, que zera o tamanho. */
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(180deg,#171c26,#12161e);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));flex:0 0 auto;
}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#8b1030);
  display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.htitle{font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.1}
.hsub{font-size:11px;color:var(--mut);line-height:1.1;margin-top:2px}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:5px 10px;font-size:12px;max-width:130px}
.userchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
nav{
  display:flex;flex:0 0 auto;background:#12161e;border-top:1px solid var(--line);
  padding-bottom:var(--safe);
}
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.2px;border-top:2px solid transparent}
nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--tx);border-top-color:var(--acc)}
nav button.on .ic{filter:drop-shadow(0 0 8px rgba(224,43,69,.6))}

/* ---------- pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:7px;display:block}
.inp{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
  outline:none;transition:border-color .12s}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:#5d6879}
.big{font-size:26px;font-weight:800;letter-spacing:1px;text-align:center;padding:16px 14px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-weight:650;font-size:14px;width:100%}
.btn:active{transform:scale(.985)}
.btn.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:#ff5f79;color:#fff;
  box-shadow:0 5px 18px -6px rgba(224,43,69,.8)}
.btn.ok{background:linear-gradient(180deg,#16d29a,var(--ok));border-color:#2ee0aa;color:#04241a;
  box-shadow:0 5px 18px -6px rgba(18,185,129,.7)}
.btn.gh{background:transparent}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn.dg{color:#ff6b81;border-color:#4a2430}
.row{display:flex;gap:9px}
.row>*{flex:1}
.muted{color:var(--mut)}
.tiny{font-size:11.5px}
.sec-title{font-size:12px;font-weight:750;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);
  margin:18px 2px 9px}
.sec-title:first-child{margin-top:2px}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.pill.kg{background:#0d2f4d;border-color:#1d5c8f;color:#8fd0ff}
.pill.un{background:#3a2a08;border-color:#7a5a12;color:#ffd479}
.pill.ac{background:#3d1420;border-color:#7d2338;color:#ffa3b3}
.empty{text-align:center;padding:44px 18px;color:var(--mut)}
.empty .ic{font-size:40px;opacity:.35;display:block;margin-bottom:10px}

/* ---------- contagem ---------- */
.hero{background:linear-gradient(160deg,#1d2432,#141821);border:1px solid var(--line);
  border-radius:16px;padding:15px;margin-bottom:12px}
.scanline{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.scanline .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
  animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.found{border:1.5px solid #2c5f4a;background:linear-gradient(160deg,#0f2a22,#0e1a18);border-radius:14px;
  padding:14px;margin-bottom:12px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.found .nm{font-size:19px;font-weight:800;line-height:1.25;margin-bottom:8px}
.found .meta{display:flex;flex-wrap:wrap;gap:6px}
.found .cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut);margin-bottom:8px}
.qtywrap{position:relative}
.qtywrap .un{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:800;
  font-size:16px;color:var(--acc2);pointer-events:none}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.keys button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 4px;
  font-weight:700;font-size:13.5px}
.sug{margin-top:10px;max-height:56dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);
  border-radius:12px;background:var(--panel2);animation:pop .14s ease-out}
.sug .hint{padding:8px 12px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--line);
  font-weight:650;letter-spacing:.3px}
.sug button{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:0}
.sug button.sel{background:#2e1a21;box-shadow:inset 3px 0 0 var(--acc)}
.sug .l1{display:flex;align-items:center;gap:8px}
.sug .nm{font-weight:650;font-size:13.5px;line-height:1.25;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .l2{font-size:11px;color:var(--mut);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug mark{background:transparent;color:var(--acc2);font-weight:800}
.err{border:1.5px solid #6b2233;background:#2a1119;border-radius:14px;padding:14px;margin-bottom:12px;
  animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:10px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin-top:3px;font-weight:650}

/* ---------- listas ---------- */
.item{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;margin-bottom:7px}
.item .l{flex:1;min-width:0}
.item .nm{font-weight:650;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:11px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:0 0 auto}
.item .q{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grp{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:12px;font-weight:750;
  letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.grp:before{content:"";flex:1;height:1px;background:var(--line);order:2}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:650;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc2);color:#fff}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ee0b8);border-radius:99px}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--safe));z-index:60;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:calc(100% - 28px)}
.tst{background:#1e2836;border:1px solid #33415a;border-radius:11px;padding:10px 15px;font-size:13.5px;
  font-weight:650;box-shadow:0 10px 30px -8px #000;animation:up .2s;max-width:100%}
.tst.ok{background:#0d3a2c;border-color:#1c7a5c;color:#8ff0d0}
.tst.er{background:#3d1420;border-color:#7d2338;color:#ffb3c0}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ---------- portão de licença ---------- */
#gate{position:fixed;inset:0;z-index:95;background:radial-gradient(120% 90% at 50% 0%,#20121a,#07090d 70%);
  display:flex;align-items:center;justify-content:center;padding:22px;overflow-y:auto}
body.travado #app{filter:blur(7px) saturate(.5);pointer-events:none;user-select:none}
.gatebox{width:100%;max-width:400px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;
  box-shadow:0 26px 70px -22px #000;animation:pop .22s ease-out}
.gatebox h2{margin:12px 0 6px;font-size:21px;letter-spacing:.2px}
.gatelogo{width:58px;height:58px;margin:0 auto;border-radius:17px;
  background:linear-gradient(135deg,var(--acc),#6d0c24);display:grid;place-items:center;font-size:27px;
  box-shadow:0 10px 28px -10px var(--acc)}
.gatebox .inp{text-align:center}
.gatebox .btn{margin-top:12px}
.ovl{position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(3px);z-index:70;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px;
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding-bottom:calc(18px + var(--safe));
  animation:up .2s}
.sheet h3{margin:0 0 4px;font-size:17px}
@media(min-width:640px){
  main{max-width:760px;margin:0 auto;width:100%}
  header{justify-content:center}
  .ovl{align-items:center}
  .sheet{border-radius:18px;max-width:520px}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">🥩</div>
    <div>
      <div class="htitle">Inventário</div>
      <div class="hsub" id="hsub">Contagem de estoque</div>
    </div>
    <div class="spacer"></div>
    <button class="userchip" onclick="askUser()">👤 <b id="uname">—</b></button>
  </header>

  <main id="main"></main>

  <nav>
    <button data-v="count" class="on"><span class="ic">⌨️</span>Contar</button>
    <button data-v="prods"><span class="ic">📦</span>Produtos</button>
    <button data-v="hist"><span class="ic">🕑</span>Histórico</button>
    <button data-v="rep"><span class="ic">📊</span>Relatório</button>
    <button data-v="cfg"><span class="ic">⚙️</span>Ajustes</button>
  </nav>
</div>

<div id="gate" class="hide"></div>
<div id="toast"></div>
<div id="modal"></div>

/* SHA-256 em JS puro: o Web Crypto não existe em páginas abertas por file:// */
function sha256(msg){
  const K=new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
                           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  let b;
  if(typeof TextEncoder!=='undefined') b=Array.from(new TextEncoder().encode(msg));
  else { b=[]; for(let i=0;i<msg.length;i++){ const c=msg.charCodeAt(i);
    if(c<128) b.push(c);
    else if(c<2048) b.push(192|(c>>6),128|(c&63));
    else b.push(224|(c>>12),128|((c>>6)&63),128|(c&63)); } }
  const bits=b.length*8;
  b.push(0x80);
  while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(Math.floor(bits/Math.pow(2,i*8))&0xff);
  const w=new Uint32Array(64), rot=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<b.length;i+=64){
    for(let j=0;j<16;j++)
      w[j]=((b[i+j*4]<<24)|(b[i+j*4+1]<<16)|(b[i+j*4+2]<<8)|b[i+j*4+3])>>>0;
    for(let j=16;j<64;j++){
      const a1=w[j-15], a2=w[j-2];
      const s0=(rot(a1,7)^rot(a1,18)^(a1>>>3))>>>0;
      const s1=(rot(a2,17)^rot(a2,19)^(a2>>>10))>>>0;
      w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;
    }
    let a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let j=0;j<64;j++){
      const S1=(rot(e,6)^rot(e,11)^rot(e,25))>>>0;
      const ch=((e&f)^((~e)&g))>>>0;
      const t1=(h+S1+ch+K[j]+w[j])>>>0;
      const S0=(rot(a,2)^rot(a,13)^rot(a,22))>>>0;
      const mj=((a&bb)^(a&c)^(bb&c))>>>0;
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return Array.from(H).map(x=>x.toString(16).padStart(8,'0')).join('');
}

const LIC={ estado:'ausente', para:'', ate:'', dias:0 };
const normChave=k=>String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const hoje0=()=>{const d=new Date(); d.setHours(0,0,0,0); return d.getTime();};
const diaDe=s=>{const [a,m,d]=String(s).split('-').map(Number); return new Date(a,m-1,d,23,59,59).getTime();};

function confereChave(k){
  const n=normChave(k);
  if(n.length<12) return null;
  const h=sha256(LIC_SAL+n);
  return LICENCAS.find(l=>l.h===h)||null;
}

/* Lê a ativação gravada e decide o estado. Relógio atrasado não reabre
   uma licença vencida: o app guarda a data mais adiantada que já viu.   */
async function verificarLicenca(){
  const reg=await DB.get('meta','licenca');
  if(!reg||!reg.v||!reg.v.h){ LIC.estado='ausente'; return LIC; }
  const l=LICENCAS.find(x=>x.h===reg.v.h);
  if(!l){ LIC.estado='revogada'; return LIC; }        // chave saiu desta versão do arquivo
  LIC.para=l.para; LIC.ate=l.ate;
  const marco=await DB.get('meta','maiorData');
  const visto=(marco&&marco.v)||0;
  const agora=Math.max(hoje0(), visto);
  if(hoje0()>visto) await DB.put('meta',{k:'maiorData',v:hoje0()});
  const limite=diaDe(l.ate);
  LIC.dias=Math.ceil((limite-agora)/86400000);
  LIC.estado = agora>limite ? 'vencida' : 'ativa';
  return LIC;
}
async function ativarLicenca(){
  const campo=$('#lic_k'); const l=confereChave(campo.value);
  if(!l){ beep(false); $('#lic_erro').textContent='Chave inválida. Confira os caracteres e tente de novo.'; campo.select(); return; }
  if(hoje0()>diaDe(l.ate)){ $('#lic_erro').textContent=`Esta chave venceu em ${l.ate.split('-').reverse().join('/')}.`; return; }
  await DB.put('meta',{k:'licenca',v:{h:l.h, em:Date.now()}});
  await verificarLicenca();
  beep(true); telaLicenca(); render();
  toast('Aparelho liberado','ok');
  $('#hsub').textContent=`${esc(LIC.para)} · ${S.dev.nome}`;
  if(MIG_PEND){ avisoMigracao(MIG_PEND); MIG_PEND=null; return; }   // aviso que ficou represado
  if(!S.user) setTimeout(askUser,300);
}
function confirmarRemoverLicenca(){
  modal(`<h3>Remover a ativação?</h3>
    <p class="tiny muted">O aparelho volta a pedir a chave na próxima abertura. As contagens
    e o cadastro continuam aqui, intactos.</p>
    <div class="row" style="margin-top:16px">
      <button class="btn gh" onclick="closeModal()">Cancelar</button>
      <button class="btn dg" onclick="closeModal();removerLicenca()">Remover</button></div>`);
}
async function removerLicenca(){
  await DB.del('meta','licenca');
  await verificarLicenca(); telaLicenca();
  toast('Ativação removida deste aparelho');
}

/* Porta de entrada: sem licença válida o app não conta.
   Vencida é diferente de ausente — ali os dados ainda podem ser exportados. */
function telaLicenca(){
  const g=$('#gate');
  if(LIC.estado==='ativa'){ g.classList.add('hide'); document.body.classList.remove('travado'); return; }
  document.body.classList.add('travado');
  const vencida=LIC.estado==='vencida', revogada=LIC.estado==='revogada';
  g.classList.remove('hide');
  g.innerHTML=`<div class="gatebox">
    <div class="gatelogo">🔒</div>
    <h2>${vencida?'Licença vencida':revogada?'Chave não reconhecida':'Aparelho não liberado'}</h2>
    <p class="tiny muted" style="line-height:1.7">
      ${vencida? `A licença de <b>${esc(LIC.para)}</b> venceu em ${LIC.ate.split('-').reverse().join('/')}.
                  Suas contagens continuam guardadas e podem ser exportadas abaixo. Informe uma chave nova para voltar a contar.`
       : revogada? 'A chave gravada neste aparelho não consta nesta versão do aplicativo. Informe uma chave válida.'
       : 'Este aplicativo é de uso restrito. Informe a chave de liberação para começar a usar.'}
    </p>
    <input id="lic_k" class="inp big" style="font-size:16px;letter-spacing:1px;margin-top:16px;padding:14px 10px"
           placeholder="TRN-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div id="lic_erro" class="tiny" style="color:#ff6b81;min-height:17px;margin-top:8px;font-weight:650"></div>
    <button class="btn pri" onclick="ativarLicenca()">Liberar aparelho</button>
    ${vencida?`<button class="btn" style="margin-top:8px" onclick="exportar()">⬇️ Exportar minhas contagens</button>
               <button class="btn" style="margin-top:8px" onclick="backup()">💾 Gerar backup completo</button>`:''}
    <p class="tiny muted" style="margin-top:16px">Não tem a chave? Fale com o responsável pelo inventário.</p>
  </div>`;
  const i=$('#lic_k');
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();ativarLicenca()} });
  setTimeout(()=>i.focus(),80);
}

/* ------------------------------- DB ---------------------------------- */
const DB = (() => {
  const NAME='inventario_estoque', VER=1;
  let db=null;
  function open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(NAME,VER);
      r.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains('produtos')){
          const s=d.createObjectStore('produtos',{keyPath:'codigo'});
          s.createIndex('dep','dep'); s.createIndex('fam','fam'); s.createIndex('norm','norm');
        }
        if(!d.objectStoreNames.contains('contagens')){
          const s=d.createObjectStore('contagens',{keyPath:'id',autoIncrement:true});
          s.createIndex('codigo','codigo'); s.createIndex('ts','ts');
        }
        if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
      };
      r.onsuccess=()=>{db=r.result;res(db)}; r.onerror=()=>rej(r.error);
    });
  }
  const tx=(st,mode)=>db.transaction(st,mode).objectStore(st);
  const p=req=>new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});
  return {
    open,
    all:s=>p(tx(s,'readonly').getAll()),
    get:(s,k)=>p(tx(s,'readonly').get(k)),
    put:(s,v)=>p(tx(s,'readwrite').put(v)),
    del:(s,k)=>p(tx(s,'readwrite').delete(k)),
    clear:s=>p(tx(s,'readwrite').clear()),
    bulk(s,arr){
      return new Promise((res,rej)=>{
        const t=db.transaction(s,'readwrite'), o=t.objectStore(s);
        arr.forEach(v=>o.put(v));
        t.oncomplete=()=>res(arr.length); t.onerror=()=>rej(t.error);
      });
    }
  };
})();

/* ------------------------------ Store -------------------------------- */
const S = {
  prods:[], byCode:new Map(), byNorm:new Map(),
  counts:[], totals:new Map(),
  user:'', cfg:{beep:true,vibra:true,balanca:false,pecas:true,fixar:true},
  dev:{id:'',nome:''},        // identidade do aparelho — permite mesclar sem duplicar
  lastExport:0, lastCatalogo:0, persist:null,

  norm(c){ const s=String(c||'').trim().toUpperCase(); const n=s.replace(/^0+/,''); return n||s; },

  async load(){
    this.prods = await DB.all('produtos');
    if(!this.prods.length){ await this.seed(); this.prods = await DB.all('produtos'); }
    this.counts = await DB.all('contagens');
    const u = await DB.get('meta','user'); this.user = u? u.v : '';
    const c = await DB.get('meta','cfg'); if(c) this.cfg = Object.assign(this.cfg, c.v);
    const d = await DB.get('meta','dev');
    if(d && d.v && d.v.id) this.dev = d.v;
    else {
      this.dev={id:Math.random().toString(36).slice(2,6).toUpperCase(), nome:'Aparelho 1'};
      await DB.put('meta',{k:'dev',v:this.dev});
    }
    const le = await DB.get('meta','lastExport'); this.lastExport = le? le.v : 0;
    const lc = await DB.get('meta','lastCatalogo'); this.lastCatalogo = lc? lc.v : 0;
    this.index();
  },
  // produtos cadastrados aqui depois do último catálogo enviado
  catalogoPendente(){ return this.prods.filter(p=>p.em && p.em>this.lastCatalogo).length; },
  // identificador único de um lançamento — lançamentos antigos ganham um a partir do id local
  uidOf(c){ return c.uid || `LOCAL-${c.id}`; },
  naoExportados(){ return this.counts.filter(c=>c.ts>this.lastExport).length; },
  async seed(){
    await DB.bulk('produtos', SEED.map(p=>({
      codigo:String(p.codigo), nome:p.nome, un:p.un, fam:p.fam, dep:p.dep, norm:this.norm(p.codigo)
    })));
  },
  index(){
    this.byCode=new Map(); this.byNorm=new Map();
    for(const p of this.prods){
      this.byCode.set(String(p.codigo).toUpperCase(), p);
      const n=this.norm(p.codigo);
      if(!this.byNorm.has(n)) this.byNorm.set(n,p);
    }
    this.recalc();
  },
  recalc(){
    this.totals=new Map();
    for(const c of this.counts){
      const t=this.totals.get(c.codigo)||{qtd:0,pec:0,n:0,last:0};
      t.qtd+=Number(c.qtd)||0; t.pec+=pcs(c); t.n++; t.last=Math.max(t.last,c.ts);
      this.totals.set(c.codigo,t);
    }
  },
  /* Busca por código OU nome, devolvendo candidatos ordenados por relevância.
     0 código exato · 1 código sem zeros · 2 fim do código · 3 trecho do código
     4 nome começa com · 5 nome contém todas as palavras                        */
  buscar(raw, lim=12){
    const s=String(raw||'').trim().toUpperCase();
    if(!s) return [];
    const nrm=this.norm(s), digitos=/^\d+$/.test(s);
    const termos=s.split(/\s+/).filter(Boolean);
    const hits=[];
    for(const p of this.prods){
      const cod=String(p.codigo).toUpperCase(), nome=String(p.nome).toUpperCase();
      let r=-1;
      if(cod===s) r=0;
      else if(this.norm(cod)===nrm) r=1;
      else if(digitos && cod.endsWith(s)) r=2;
      else if(digitos && cod.includes(s)) r=3;
      else if(nome.startsWith(s)) r=4;
      else if(termos.every(t=>nome.includes(t))) r=5;
      if(r>=0) hits.push({p,r});
    }
    hits.sort((a,b)=>a.r-b.r || a.p.nome.localeCompare(b.p.nome));
    return hits.slice(0,lim).map(h=>h.p);
  },
  find(raw){
    let q=String(raw||'').trim().toUpperCase();
    if(!q) return null;
    if(this.byCode.has(q)) return this.byCode.get(q);
    // etiqueta de balança EAN-13: 2 + PLU(6) + peso-gramas(5) + DV
    if(this.cfg.balanca && /^2\d{12}$/.test(q)){
      const plu=q.slice(1,7), gr=parseInt(q.slice(7,12),10);
      const p=this.byNorm.get(this.norm(plu));
      if(p) return Object.assign({},p,{_peso: gr/1000});
    }
    const n=this.norm(q);
    if(this.byNorm.has(n)) return this.byNorm.get(n);
    // sem chute: código parecido não resolve sozinho, quem decide é o operador (ver buscarEnter)
    return null;
  },
  async addCount(prod, qtd, pecas){
    const d=new Date();
    // em KG as peças são informadas à parte; em UN a própria quantidade já é a peça
    const pec = prod.un==='KG' ? (Number(pecas)>0?Math.round(Number(pecas)):1) : Math.round(Number(qtd));
    const uid = `${this.dev.id}-${d.getTime().toString(36)}-${Math.random().toString(36).slice(2,5)}`;
    const rec={ uid, dev:this.dev.nome,
                codigo:prod.codigo, nome:prod.nome, un:prod.un, fam:prod.fam, dep:prod.dep,
                qtd:Number(qtd), pecas:pec, usuario:this.user||'—', ts:d.getTime() };
    const id=await DB.put('contagens',rec);
    rec.id=id; this.counts.push(rec); this.recalc();
    if(this.counts.length % 50 === 0) snapshot('automático');
    return rec;
  },
  async delCount(id){
    await DB.del('contagens',id);
    this.counts=this.counts.filter(c=>c.id!==id); this.recalc();
  },
  // junta lançamentos vindos de outro aparelho, ignorando o que já existe aqui
  async mesclar(recs){
    const have=new Set(this.counts.map(c=>this.uidOf(c)));
    const novos=[], repetidos=[];
    for(const r of recs){
      const uid=r.uid||`IMP-${r.ts}-${r.codigo}-${r.qtd}`;
      if(have.has(uid)){ repetidos.push(r); continue; }
      have.add(uid);
      novos.push({uid, dev:r.dev||'importado', codigo:String(r.codigo), nome:r.nome,
                  un:r.un==='KG'?'KG':'UN', fam:r.fam||'', dep:r.dep||'',
                  qtd:parseNum(r.qtd),
                  pecas:Math.round(parseNum(r.pecas))||(r.un==='KG'?1:Math.round(parseNum(r.qtd))||0),
                  usuario:r.usuario||'—', ts:Number(r.ts)||Date.now()});
    }
    if(novos.length) await DB.bulk('contagens',novos);
    this.counts=await DB.all('contagens'); this.recalc();
    return {novos:novos.length, repetidos:repetidos.length,
            aparelhos:[...new Set(novos.map(n=>n.dev))]};
  },
  async saveCfg(){ await DB.put('meta',{k:'cfg',v:this.cfg}); },
  async setUser(v){ this.user=v; await DB.put('meta',{k:'user',v}); },
  deps(){ return [...new Set(this.prods.map(p=>p.dep))].sort(); },
  fams(){ return [...new Set(this.prods.map(p=>p.fam))].sort(); }
};

/* ---------------------------- Utilidades ----------------------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,un)=>un==='KG'? Number(v).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})
                          : Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
// peças de um lançamento — registros antigos (sem o campo) são tratados com segurança
const pcs=c => c.pecas!=null ? Number(c.pecas)||0 : (c.un==='KG' ? 1 : Math.round(Number(c.qtd))||0);
const nfp=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
const dt=ts=>new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const dOnly=ts=>new Date(ts).toLocaleDateString('pt-BR');
// data e hora curtas, sem a vírgula do toLocaleString — usadas nos cabeçalhos da planilha
const dtC=ts=>new Date(ts).toLocaleDateString('pt-BR')+' '+
  new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const pctBR=v=>(v*100).toFixed(1).replace('.',',')+'%';

/* Converte texto em número sem se confundir com o separador.
   Números vindos de planilha já chegam como number e passam direto.
   Em texto: manda o separador que aparece por último; só com pontos,
   "1.234.567" e "500.000" são agrupamento, mas "500.5" é decimal.      */
function parseNum(v){
  if(typeof v==='number') return isFinite(v)? v : 0;
  let s=String(v??'').trim().replace(/\s|[R$]/g,'');
  if(!s) return 0;
  const c=s.lastIndexOf(','), d=s.lastIndexOf('.');
  if(c>=0 && d>=0)  s = c>d ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(c>=0)     s = s.replace(',','.');
  else if(d>=0){
    const p=s.split('.');
    const agrupado = p.length>2 || (p.length===2 && p[1].length===3 && p[0].length<=3);
    if(agrupado) s=s.replace(/\./g,'');
  }
  const n=parseFloat(s);
  return isFinite(n)? n : 0;
}
const hOnly=ts=>new Date(ts).toLocaleTimeString('pt-BR');

function toast(msg,type=''){

}
let AC=null;
// o iPhone só deixa tocar som depois de um toque do usuário, e ainda
// suspende o áudio quando o app volta do segundo plano
function acordarAudio(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
}
['touchend','mousedown','keydown'].forEach(ev=>
  document.addEventListener(ev,acordarAudio,{once:false,passive:true}));
function beep(ok=true){
  if(!S.cfg.beep) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value=ok?1180:240; o.type='square';
    g.gain.setValueAtTime(.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(ok?.09:.26));
    o.start(); o.stop(AC.currentTime+(ok?.1:.28));
  }catch(e){}
}

/* ---------------- sugestões de produto ----------------
   A lista mostra TODOS os produtos que combinam com o que foi digitado,
   não só os primeiros: é assim que se procura um item pelo nome.         */
const LIM_SUG=300;
let SUG=[], SEL=-1;
const limpaSug=()=>{ SUG=[]; SEL=-1; const s=$('#sug'); if(s) s.innerHTML=''; };

function realce(txt,q){
  const t=String(txt), s=String(q).trim();
  if(!s) return esc(t);
  const i=t.toUpperCase().indexOf(s.toUpperCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length));
}

function renderSug(q){
  const el=$('#sug'); if(!el) return;
  const s=String(q||'').trim();
  if(s.length<2){ limpaSug(); return; }
  SUG=S.buscar(s,LIM_SUG); SEL=-1;
  if(!SUG.length){
    el.innerHTML=`<div class="sug"><div class="hint">Nenhum produto com “${esc(s)}”. Enter para cadastrar.</div></div>`;
    return;
  }
  el.innerHTML=`<div class="sug">
    <div class="hint">${SUG.length===1?'1 produto encontrado'
      :`${SUG.length} produtos encontrados${SUG.length>=LIM_SUG?' (limite da tela)':''} — role a lista, toque, ou use ↑ ↓ e Enter`}</div>
    ${SUG.map((p,i)=>`
      <button data-i="${i}" onclick="escolher('${esc(p.codigo)}')">
        <div class="l1">
          <span class="nm">${realce(p.nome,s)}</span>
          <span class="pill ${p.un==='KG'?'kg':'un'}">${p.un}</span>
        </div>
        <div class="l2">${realce(p.codigo,s)} · ${esc(p.fam)} › ${esc(p.dep)}${
          S.totals.has(p.codigo)? ` · <span style="color:var(--ok)">já contado ${nf(S.totals.get(p.codigo).qtd,p.un)} ${p.un}</span>`:''}</div>
      </button>`).join('')}

}
function pintaSug(){
  const bs=$('#sug').querySelectorAll('button');
  bs.forEach((b,i)=>b.classList.toggle('sel',i===SEL));
  if(bs[SEL] && bs[SEL].scrollIntoView) bs[SEL].scrollIntoView({block:'nearest'});
}
function escolher(cod){ limpaSug(); lookup(cod); }

/* Enter no campo de código/nome:
   1) código exato (completo, sem zeros à esquerda, ou etiqueta de balança) abre direto — velocidade intacta;
   2) um único candidato abre direto;
   3) vários candidatos (nome digitado ou código parcial) viram lista de escolha;
   4) nada encontrado cai no card que oferece cadastrar.
   A lista de parecidos já aparece enquanto se digita, então nada passa despercebido. */
function buscarEnter(raw){
  const s=String(raw||'').trim();
  if(!s) return;
  const up=s.toUpperCase();
  if(S.find(up)){ limpaSug(); lookup(up); return; }
  const lista=S.buscar(up,LIM_SUG);
  if(lista.length===1){ escolher(lista[0].codigo); return; }
  if(!lista.length){ limpaSug(); lookup(up); return; }
  renderSug(s); SEL=0; pintaSug();
  beep(true); vib(20);
}

      </div>
      <div class="tiny muted" id="jac" style="margin-top:9px">${jacHTML(p)}</div>

        <div style="flex:1.9">
          <label class="lbl">Peso em quilos</label>
          <div class="qtywrap">
            <input id="qtd" class="inp big" inputmode="decimal" autocomplete="off" placeholder="0,000"
                   style="padding-right:46px" value="${p._peso?String(p._peso).replace('.',','):''}">
            <span class="un">KG</span>
          </div>
        </div>
        <div style="flex:1">
          <label class="lbl">Peças</label>
          <div class="qtywrap">
            <input id="pec" class="inp big" inputmode="numeric" autocomplete="off" value="1"
                   style="padding-right:34px;font-size:22px">
            <span class="un" style="font-size:13px">pç</span>
          </div>
        </div>
      </div>`:`
      <label class="lbl" style="margin-top:13px">Quantidade em ${p.un==='KG'?'quilos':'unidades'}</label>
      <div class="qtywrap">
        <input id="qtd" class="inp big" inputmode="decimal" autocomplete="off"
               placeholder="0${p.un==='KG'?',000':''}" style="padding-right:56px" value="${p._peso?String(p._peso).replace('.',','):''}">
        <span class="un">${p.un}</span>
      </div>`}
      <div class="keys">
        ${(p.un==='KG'?[0.5,1,2,5,10,-1,'C','OK']:[1,2,6,12,24,-1,'C','OK']).map(k=>
          k==='OK'?`<button style="grid-column:span 2;background:var(--ok);color:#04241a;border-color:#2ee0aa" onclick="salvar()">✓ GRAVAR</button>`
          :k==='C'?`<button onclick="qz('C')">C</button>`
          :k===-1?`<button onclick="qz(-1)">⌫</button>`
          :`<button onclick="qz(${k})">+${String(k).replace('.',',')}</button>`).join('')}
      </div>
      <button class="btn gh sm" style="width:100%;margin-top:8px" onclick="limpar()">
        ${S.cfg.fixar?'🔄 Trocar de produto (Esc)':'Cancelar (Esc)'}</button>
    </div>`;
  const qi=$('#qtd'), pi=$('#pec');
  qi.focus({preventScroll:true}); qi.select();
  qi.addEventListener('keydown',e=>{
    // com peças: Enter pula para o campo de peças (já preenchido com 1)
    if(e.key==='Enter'){ e.preventDefault(); if(pi){pi.focus();pi.select()} else salvar(); }
    if(e.key==='Escape'){e.preventDefault();limpar()}
  });
  if(pi) pi.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();salvar()}
    if(e.key==='Escape'){e.preventDefault();limpar()}
  });
}
// peças em campo próprio: só faz sentido em produtos vendidos por peso
const usaPecas=p => p.un==='KG' && S.cfg.pecas;

function qz(k){
  const q=$('#qtd'); if(!q) return;
  if(k==='C'){ q.value=''; }
  else if(k===-1){ q.value=q.value.slice(0,-1); }
  else { q.value=String(parseNum(q.value)+k).replace('.',','); }
  q.focus();
}
function limpar(){ CUR=null; SESS=null; limpaSug(); $('#slot').innerHTML='';
  const c=$('#cod'); if(c){c.value='';c.focus()} }

// alterna entre travar o produto na tela e voltar ao código a cada item
async function togFixar(){
  S.cfg.fixar=!S.cfg.fixar; await S.saveCfg();
  const q=$('#qtd'), pi=$('#pec');
  const vq=q?q.value:'', vp=pi?pi.value:'';
  if(CUR){
    lookup(CUR.codigo,true);
    if($('#qtd')) $('#qtd').value=vq;
    if($('#pec')&&vp) $('#pec').value=vp;
    $('#qtd').focus();
  }
  toast(S.cfg.fixar?'📌 Produto fica travado na tela':'Volta ao código a cada item');
}

async function salvar(){
  if(!CUR) return;
  if(!S.user){ askUser(); return; }
  const v=parseNum($('#qtd').value);
  if(!(v>0)){ beep(false); vib(60); toast('Informe uma quantidade válida','er'); $('#qtd').focus(); return; }
  const pi=$('#pec');
  let pc=1;
  if(pi){
    pc=parseInt(String(pi.value).replace(/\D/g,''),10);
    if(!(pc>0)){ beep(false); vib(60); toast('Número de peças inválido','er'); pi.focus(); pi.select(); return; }
  }
  const p=CUR;
  await S.addCount(p,v,pc);
  beep(true); vib(45);
  toast(`✓ ${nf(v,p.un)} ${p.un}${pi?` · ${pc} pç`:''} — ${p.nome.slice(0,22)}`,'ok');

  if(S.cfg.fixar){
    // produto continua na tela: limpa só a quantidade e volta o cursor para ela
    if(!SESS||SESS.cod!==p.codigo) SESS={cod:p.codigo,n:0,qtd:0,pec:0};
    SESS.n++; SESS.qtd+=v; SESS.pec+=pc;
    const jac=$('#jac'); if(jac) jac.innerHTML=jacHTML(p);
    const qi=$('#qtd'); qi.value=''; if(pi) pi.value='1';
    qi.focus({preventScroll:true});
  } else {
    limpar();
  }
  renderUlt();
  const st=$('#main').querySelectorAll('.stat .v');
  if(st.length){
    const hoje=new Date().setHours(0,0,0,0);
    st[0].textContent=S.counts.filter(c=>c.ts>=hoje).length;
    st[1].textContent=S.totals.size;
  }
}
/* Excluir uma pesagem pede confirmação: o ✕ fica ao lado do dedo
   durante a contagem e um toque errado apagaria o registro sem volta. */
function undo(id){
  const c=S.counts.find(x=>x.id===id);
  if(!c){ toast('Lançamento não encontrado','er'); return; }
  const t=S.totals.get(c.codigo);
  modal(`<h3>Excluir esta pesagem?</h3>
    <div class="card" style="margin:12px 0 0;background:var(--panel2)">
      <div style="font-weight:750;font-size:15px;line-height:1.3">${esc(c.nome)}</div>
      <div class="tiny muted" style="margin-top:5px">CÓD ${esc(c.codigo)} · ${esc(c.dep)}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:11px">
        <div class="tiny muted">${dOnly(c.ts)} às ${hOnly(c.ts)}<br>👤 ${esc(c.usuario)}${
          c.dev&&c.dev!==S.dev.nome?` · 📱 ${esc(c.dev)}`:''}</div>
        <div style="text-align:right">
          <div style="font-weight:800;font-size:19px">${nf(c.qtd,c.un)} <span class="muted" style="font-size:13px">${c.un}</span></div>
          ${c.un==='KG'?`<div class="tiny muted">${nfp(pcs(c))} pç</div>`:''}
        </div>
      </div>
    </div>
    <p class="tiny muted" style="margin:12px 0 0">
      ${t&&t.n>1? `Este produto tem ${t.n} pesagens somando ${nf(t.qtd,c.un)} ${c.un}.
                   Vai ficar com ${t.n-1}, somando ${nf(t.qtd-Number(c.qtd),c.un)} ${c.un}.`
                : 'É a única pesagem deste produto — ele volta a constar como não contado.'}
      <br>Não dá para desfazer.
    </p>
    <div class="row" style="margin-top:16px">
      <button class="btn gh" onclick="closeModal()">Cancelar</button>
      <button class="btn dg" onclick="undoOk(${id})">Excluir</button>
    </div>`);
}
async function undoOk(id){
  await S.delCount(id);
  closeModal(); vib(40); toast('Pesagem excluída','ok'); render();
}

let fDep='', fFam='', fBusca='', fPend=false;
function vProds(){
  $('#main').innerHTML=`
    <input class="inp" id="bsc" placeholder="🔎 Buscar por nome ou código" value="${esc(fBusca)}">
    <div class="chips" style="margin-top:10px">
      <button class="chip ${!fFam?'on':''}" onclick="setF('fam','')">Todas famílias</button>
      ${S.fams().map(f=>`<button class="chip ${fFam===f?'on':''}" onclick="setF('fam','${esc(f)}')">${esc(f)}</button>`).join('')}
    </div>
    <div class="chips">
      <button class="chip ${!fDep?'on':''}" onclick="setF('dep','')">Todos deptos</button>
      ${S.deps().map(d=>`<button class="chip ${fDep===d?'on':''}" onclick="setF('dep','${esc(d)}')">${esc(d)}</button>`).join('')}
    </div>
    <div class="chips">

function setF(k,v){
  if(k==='fam')fFam=v; if(k==='dep')fDep=v; if(k==='pend')fPend=v;
  vProds();
}
function plist(){
  const q=fBusca.trim().toUpperCase();
  let arr=S.prods.filter(p=>
    (!fDep||p.dep===fDep) && (!fFam||p.fam===fFam) &&
    (!q || p.nome.toUpperCase().includes(q) || String(p.codigo).includes(q)) &&
    (!fPend || !S.totals.has(p.codigo))
  );
  arr.sort((a,b)=> a.fam.localeCompare(b.fam)||a.dep.localeCompare(b.dep)||a.nome.localeCompare(b.nome));
  const el=$('#plist');
  if(!arr.length){ el.innerHTML=`<div class="empty"><span class="ic">🔍</span>Nenhum produto encontrado.</div>`; return; }
  let html=`<div class="tiny muted" style="margin:4px 2px 10px">${arr.length} produto(s)</div>`, g='';
  for(const p of arr){
    const key=p.fam+' › '+p.dep;
    if(key!==g){ g=key; html+=`<div class="grp"><span>${esc(key)}</span></div>`; }
    const t=S.totals.get(p.codigo);
    html+=`<div class="item" onclick="editProduto('${esc(p.codigo)}')">
      <div class="l">
        <div class="nm">${esc(p.nome)}</div>
        <div class="sub">${esc(p.codigo)} · ${p.un}</div>
      </div>
      <div class="r">${ t?`<div class="q" style="color:var(--ok)">${nf(t.qtd,p.un)}</div><div class="tiny muted">${p.un==='KG'?nfp(t.pec)+' pç · ':''}${t.n}×</div>`
                        :`<span class="pill">pendente</span>` }</div>
    </div>`;

  el.innerHTML=html;
}

function editProduto(cod){

async function saveProduto(edit){
  const codigo=$('#e_cod').value.trim(), nome=$('#e_nom').value.trim();
  if(!codigo||!nome){ toast('Código e nome são obrigatórios','er'); return; }
  if(!edit && S.byCode.has(codigo.toUpperCase())){ toast('Código já cadastrado','er'); return; }
  const antigo=S.byCode.get(codigo.toUpperCase());
  const p={codigo,nome,un:$('#e_un').value,fam:$('#e_fam').value.trim()||'GERAL',
           dep:$('#e_dep').value.trim()||'GERAL',norm:S.norm(codigo),
           em:(antigo&&antigo.em)||Date.now()};   // marca quando entrou, para o aviso de catálogo
  await DB.put('produtos',p);
  S.prods=await DB.all('produtos'); S.index();
  closeModal();
  toast(edit?'Produto atualizado':'Cadastrado — envie o catálogo aos outros aparelhos','ok');
  const hsub=$('#hsub'); if(hsub) hsub.textContent=`${S.prods.length} produtos cadastrados`;
  // cadastrou no meio da contagem? já abre o item para contar, sem voltar ao início
  if(!edit && VIEW==='count'){ vCount(); lookup(codigo); return; }
  render();
}

        <div class="l"><div class="nm">${esc(l.nome)}</div>
          <div class="sub">${esc(l.codigo)} · ${esc(l.fam)} › ${esc(l.dep)} · ${l.n}×</div>
          <div class="sub" style="color:var(--acc2)">${pctBR(l.pctUn)} do ${l.un} · ${pctBR(l.pctDep)} do depto.</div></div>
        <div class="r"><div class="q">${nf(l.qtd,l.un)}<span class="muted tiny"> ${l.un}</span></div>
          ${l.un==='KG'?`<div class="tiny muted">${nfp(l.pec)} pç</div>`:''}</div>
      </div>`).join('')
     : `<div class="empty"><span class="ic">📊</span>Nada contado ainda.</div>`}`;
}
/* Consolida as contagens por produto e calcula a participação de cada item no estoque.
   Duas bases, porque somar KG com UN não produz um número com significado:
     pctUn  = fatia do produto no total da sua unidade (todos os KG, ou todos os UN)
     pctDep = fatia do produto dentro do seu departamento, na mesma unidade      */
function resumo(){
  const grupos=new Map();
  for(const c of S.counts){                       // uma passada só — aguenta milhares de lançamentos
    let g=grupos.get(c.codigo);
    if(!g){ g={list:[],users:new Set()}; grupos.set(c.codigo,g); }
    g.list.push(c); g.users.add(c.usuario);
  }
  const out=[];
  for(const [cod,g] of grupos){
    const t=S.totals.get(cod);
    const p=S.byCode.get(String(cod).toUpperCase()) || g.list[0];
    g.list.sort((a,b)=>a.ts-b.ts);
    out.push({codigo:cod, nome:p.nome||cod, un:p.un||'UN', fam:p.fam||'', dep:p.dep||'',
              qtd:t.qtd, pec:t.pec, n:t.n, last:t.last, first:g.list[0].ts,
              media: t.n? t.qtd/t.n : 0, lanc:g.list,
              usuario:[...g.users].join(', ')});
  }
  const tUn={}, tDep={};
  for(const l of out){
    tUn[l.un]=(tUn[l.un]||0)+l.qtd;
    const k=l.dep+'|'+l.un; tDep[k]=(tDep[k]||0)+l.qtd;
  }
  for(const l of out){
    const k=l.dep+'|'+l.un;
    l.pctUn  = tUn[l.un]? l.qtd/tUn[l.un] : 0;
    l.pctDep = tDep[k]?   l.qtd/tDep[k]   : 0;
  }
  out.sort((a,b)=>a.fam.localeCompare(b.fam)||a.dep.localeCompare(b.dep)||a.nome.localeCompare(b.nome));
  out.totUn=tUn; out.totDep=tDep;
  return out;
}

/* ------------------------ Importação XLSX ---------------------------- */
function importar(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      const novos=parseRows(rows);
      if(!novos.length){ toast('Nenhum produto reconhecido na planilha','er'); return; }
      await DB.bulk('produtos',novos);
      S.prods=await DB.all('produtos'); S.index();
      toast(`${novos.length} produtos importados`,'ok'); vCfg();
    }catch(err){ console.error(err); toast('Erro ao ler a planilha','er'); }
    input.value='';
  };
  rd.readAsArrayBuffer(f);
}
function parseRows(rows){
  const out=[], seen=new Set();
  // formato A: cabeçalho com colunas nomeadas
  const hi=rows.findIndex(r=>r.some(c=>/^c[óo]d/i.test(String(c).trim())));
  const head=hi>=0? rows[hi].map(c=>String(c).trim().toLowerCase()) : [];
  const col=re=>head.findIndex(h=>re.test(h));
  const iCod=col(/c[óo]d/), iNom=col(/nome|descri/), iUn=col(/unid|^un$|medida/),
        iFam=col(/fam[íi]lia/), iDep=col(/departa/);
  const nomeado = iCod>=0 && iNom>=0 && (iFam>=0||iDep>=0);

  let fam='GERAL', dep='GERAL';
  for(let i=0;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const a=String(r[0]??'').trim();
    if(!a) continue;
    const up=a.toUpperCase();
    if(/^FAM[ÍI]LIA\s*:/.test(up)){ fam=a.split(':')[1].trim(); continue; }
    if(/^DEPARTAMENTO\s*:/.test(up)){ dep=a.split(':')[1].trim(); continue; }
    if(i===hi || /^c[óo]d/i.test(a)) continue;
    const codigo = nomeado? String(r[iCod]??'').trim() : a;
    const nome   = String((nomeado? r[iNom] : r[1])??'').replace(/\s+/g,' ').trim();
    if(!codigo||!nome) continue;
    if(seen.has(codigo)) continue; seen.add(codigo);
    const f = nomeado&&iFam>=0? (String(r[iFam]).trim()||fam) : fam;
    const d = nomeado&&iDep>=0? (String(r[iDep]).trim()||dep) : dep;
    let un = nomeado&&iUn>=0? String(r[iUn]).trim().toUpperCase() : '';
    if(!/^(KG|UN)/.test(un)) un = 'KG';   // sem coluna de unidade, assume peso
    un = un.startsWith('KG')?'KG':'UN';
    out.push({codigo,nome,un,fam:f,dep:d,norm:S.norm(codigo)});
  }
  return out;
}

/* ------------------------ Exportação XLSX ----------------------------
   Planilha formatada: cabeçalhos vermelhos, linhas de total pretas,
   formatos numéricos por unidade e percentual de participação.        */
const XV='FF8C1C13', XP='FF161616', XZ='FFF2F2F2', XB='FFD9D9D9';
const FMT_KG='#,##0.000', FMT_UN='#,##0', FMT_PC='0.0%';

function xTit(ws,r,txt,sub){
  ws.getCell(r,1).value=txt;
  ws.getCell(r,1).font={bold:true,size:16,color:{argb:XV}};
  if(sub){ ws.getCell(r+1,1).value=sub; ws.getCell(r+1,1).font={italic:true,size:10,color:{argb:'FF666666'}}; }
}
function xHead(ws,r,cols){
  cols.forEach((t,i)=>{
    const c=ws.getCell(r,i+1);
    c.value=t;
    c.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XV}};
    c.alignment={vertical:'middle',horizontal:i<2?'left':'center',wrapText:true};
    c.border={bottom:{style:'thin',color:{argb:XV}}};
  });
  ws.getRow(r).height=26;
}
function xTotal(ws,r,n){
  for(let i=1;i<=n;i++){
    const c=ws.getCell(r,i);
    c.font={bold:true,color:{argb:'FFFFFFFF'}};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XP}};
  }
}
function xZebra(ws,r,n){
  for(let i=1;i<=n;i++){
    ws.getCell(r,i).fill={type:'pattern',pattern:'solid',fgColor:{argb:XZ}};
    ws.getCell(r,i).border={bottom:{style:'hair',color:{argb:XB}}};
  }
}

async function exportar(){
  if(!S.counts.length){ toast('Nada para exportar ainda','er'); return; }
  if(typeof ExcelJS==='undefined'){ toast('Biblioteca de Excel não carregada — abra o app online uma vez','er'); return; }
  toast('Montando a planilha…');

  const res=resumo();
  const ordem=[...S.counts].sort((a,b)=>a.ts-b.ts);
  const ini=ordem[0].ts, fim=ordem[ordem.length-1].ts;
  const users=[...new Set(S.counts.map(c=>c.usuario))].join(', ');
  const totKG=res.totUn.KG||0, totUN=res.totUn.UN||0;
  const totPec=res.reduce((s,l)=>s+l.pec,0);
  const pctFeito=S.prods.length? S.totals.size/S.prods.length : 0;

  const wb=new ExcelJS.Workbook();
  wb.creator='App de Contagem de Estoque'; wb.created=new Date();

  /* ---------------- Aba 1: RESUMO ---------------- */
  const w1=wb.addWorksheet('RESUMO',{views:[{state:'frozen',ySplit:11}]});
  w1.columns=[{width:42},{width:16},{width:20},{width:24},{width:7},{width:11},{width:9},
              {width:17},{width:13},{width:15},{width:17},{width:60}];
  xTit(w1,1,'CONTAGEM DE ESTOQUE — INVENTÁRIO');
  const info=[['Licenciado para',LIC.para||'—'],
              ['Início da contagem',dtC(ini)],['Fim da contagem',dtC(fim)],['Responsável(is)',users||'—'],
              ['Total de pesagens',S.counts.length],
              ['Produtos contados',`${S.totals.size} de ${S.prods.length}  (${pctBR(pctFeito)} do cadastro)`],
              ['Totais',`${nf(totKG,'KG')} KG  ·  ${nf(totUN,'UN')} UN  ·  ${nfp(totPec)} peças`]];
  info.forEach(([k,v],i)=>{
    w1.getCell(2+i,1).value=k; w1.getCell(2+i,1).font={bold:true,size:10,color:{argb:'FF444444'}};
    w1.getCell(2+i,2).value=v; w1.getCell(2+i,2).font={size:10};
  });
  xHead(w1,11,['PRODUTO','CÓDIGO','FAMÍLIA','DEPARTAMENTO','UN','PESAGENS','PEÇAS',
               'QUANTIDADE TOTAL','% DA UNIDADE','% DO DEPTO.','MÉDIA POR PESAGEM',
               'COMO FOI CONTADO (na ordem)']);
  let r=12;
  res.forEach((l,i)=>{
    const seq=l.lanc.map(c=>nf(c.qtd,l.un));
    const comoFoi = seq.length<=40 ? seq.join('  +  ')
                  : seq.slice(0,40).join('  +  ')+`  …  (+${seq.length-40} lançamentos)`;
    w1.getRow(r).values=[l.nome,l.codigo,l.fam,l.dep,l.un,l.n,l.pec,l.qtd,l.pctUn,l.pctDep,l.media,comoFoi];
    const f = l.un==='KG'? FMT_KG : FMT_UN;
    w1.getCell(r,2).numFmt='@';                       // código como texto: preserva zeros à esquerda
    w1.getCell(r,8).numFmt=f;  w1.getCell(r,11).numFmt=f;
    w1.getCell(r,9).numFmt=FMT_PC; w1.getCell(r,10).numFmt=FMT_PC;
    w1.getCell(r,7).numFmt=FMT_UN;
    [5,6,7,9,10].forEach(c=>w1.getCell(r,c).alignment={horizontal:'center'});
    if(i%2) xZebra(w1,r,12);
    r++;
  });
  w1.autoFilter={from:{row:11,column:1},to:{row:r-1,column:12}};
  r++;
  w1.getRow(r).values=['TOTAL EM QUILOS','','','','KG',
    res.filter(l=>l.un==='KG').reduce((s,l)=>s+l.n,0),
    res.filter(l=>l.un==='KG').reduce((s,l)=>s+l.pec,0), totKG,1,'','',''];
  w1.getCell(r,8).numFmt=FMT_KG; w1.getCell(r,9).numFmt=FMT_PC; xTotal(w1,r,12); r++;
  w1.getRow(r).values=['TOTAL EM UNIDADES','','','','UN',
    res.filter(l=>l.un==='UN').reduce((s,l)=>s+l.n,0),
    res.filter(l=>l.un==='UN').reduce((s,l)=>s+l.pec,0), totUN,1,'','',''];
  w1.getCell(r,8).numFmt=FMT_UN; w1.getCell(r,9).numFmt=FMT_PC; xTotal(w1,r,12); r+=2;
  w1.getCell(r,1).value=`Gerado pelo app de contagem de estoque em ${dtC(Date.now())}`;
  w1.getCell(r,1).font={italic:true,size:9,color:{argb:'FF888888'}};

  /* ------------- Aba 2: HISTÓRICO POR PRODUTO ------------- */
  const w2=wb.addWorksheet('HISTÓRICO POR PRODUTO');
  w2.columns=[{width:8},{width:13},{width:11},{width:16},{width:7},{width:10},{width:22}];
  xTit(w2,1,'HISTÓRICO DAS CONTAGENS, PRODUTO A PRODUTO',

    w2.getRow(r2).height=18;
    for(let i=1;i<=7;i++){
      w2.getCell(r2,i).fill={type:'pattern',pattern:'solid',fgColor:{argb:XB}};

    r2++;
    const f=l.un==='KG'?FMT_KG:FMT_UN;
    l.lanc.forEach((c,i)=>{
      w2.getRow(r2).values=[i+1,dOnly(c.ts),hOnly(c.ts),Number(c.qtd),c.un,pcs(c),c.usuario];
      w2.getCell(r2,4).numFmt=f; w2.getCell(r2,6).numFmt=FMT_UN;
      [1,3,5,6].forEach(x=>w2.getCell(r2,x).alignment={horizontal:'center'});
      if(i%2) xZebra(w2,r2,7);
      r2++;

/* ---------- aplicar um catálogo recebido ----------
   Acrescenta o que falta e atualiza o que mudou. Não apaga produto nenhum:
   item que só existe aqui continua existindo.                              */
async function aplicarCatalogo(prods){
  const novos=[], mudados=[];
  for(const raw of prods||[]){
    const codigo=String(raw.codigo||'').trim();
    if(!codigo || !raw.nome) continue;
    const p={codigo, nome:String(raw.nome), un:raw.un==='KG'?'KG':'UN',
             fam:raw.fam||'GERAL', dep:raw.dep||'GERAL', norm:S.norm(codigo)};
    const atual=S.byCode.get(codigo.toUpperCase());
    if(!atual) novos.push(p);
    else if(atual.nome!==p.nome||atual.un!==p.un||atual.fam!==p.fam||atual.dep!==p.dep) mudados.push(p);
  }
  const grava=[...novos,...mudados];
  if(grava.length){ await DB.bulk('produtos',grava); S.prods=await DB.all('produtos'); S.index(); }
  return {novos:novos.length, mudados:mudados.length};
}

/* ---------- migração: substituir tudo por um backup completo ----------
   O aparelho novo passa a ser cópia fiel do antigo. Mantém o próprio código
   interno para que, se os dois continuarem contando, os lançamentos não colidam. */
async function restaurarCompleto(d){
  await snapshot('antes de substituir tudo');
  await DB.clear('produtos'); await DB.clear('contagens');
  if(d.produtos&&d.produtos.length)
    await DB.bulk('produtos', d.produtos.map(p=>({...p, codigo:String(p.codigo), norm:S.norm(p.codigo)})));
  if(d.contagens&&d.contagens.length)
    await DB.bulk('contagens', d.contagens.map(c=>({...c, codigo:String(c.codigo), qtd:parseNum(c.qtd)})));
  if(d.cfg) { S.cfg=Object.assign(S.cfg,d.cfg); await DB.put('meta',{k:'cfg',v:S.cfg}); }
  if(d.operador){ S.user=d.operador; await DB.put('meta',{k:'user',v:S.user}); }
  if(d.aparelho&&d.aparelho.nome){
    S.dev.nome=d.aparelho.nome;                    // adota o nome, mantém o código local
    await DB.put('meta',{k:'dev',v:S.dev});
  }
  S.lastExport=d.lastExport||0; await DB.put('meta',{k:'lastExport',v:S.lastExport});
  await S.load();
  return {produtos:S.prods.length, contagens:S.counts.length};
}
const ehIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

/* O Safari do iPhone ignora o atributo "download": o arquivo não cai na
   pasta, abre numa aba ou simplesmente não acontece nada. Lá usamos a
   folha de compartilhamento do sistema, que deixa salvar em Arquivos,
   mandar no WhatsApp ou por e-mail.                                      */
async function baixar(blob,nome){
  try{
    const f=new File([blob],nome,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:nome});
      return true;
    }
  }catch(e){
    if(e && e.name==='AbortError') return false;     // o usuário fechou a folha
    console.warn('compartilhamento indisponível',e);
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=nome; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  if(ehIOS()){
    modal(`<h3>Salvando o arquivo</h3>
      <p class="tiny muted" style="line-height:1.7">Se o iPhone não tiver aberto a janela de
      compartilhamento, toque no botão abaixo, depois em <b>Compartilhar</b> e escolha
      <b>Salvar em Arquivos</b>.</p>
      <a class="btn pri" style="margin-top:12px;text-decoration:none" href="${url}" target="_blank"
         rel="noopener" onclick="closeModal()">Abrir ${esc(nome)}</a>
      <button class="btn gh" style="margin-top:8px" onclick="closeModal()">Fechar</button>`);
  }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return true;
}

/* ---------- conversão do catálogo para KG ----------
   Roda uma única vez por aparelho, na primeira abertura desta versão:
   põe todos os produtos em quilo e zera as contagens, para o inventário
   começar limpo e sem registros com a unidade antiga.                   */
async function migracaoKG(){
  const m=await DB.get('meta','migracaoKG');
  if(m && m.v) return null;
  const naoKG=S.prods.filter(p=>p.un!=='KG');
  const tinha=S.counts.length;
  if(tinha) await snapshot('antes da conversão para KG');   // recuperável, por garantia
  if(naoKG.length) await DB.bulk('produtos', naoKG.map(p=>({...p, un:'KG'})));
  if(tinha) await DB.clear('contagens');
  await DB.put('meta',{k:'migracaoKG',v:Date.now()});
  await S.load();
  return {produtos:naoKG.length, contagens:tinha};
}

/* ---------- receber arquivos ---------- */
const lerTexto=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=er;r.readAsText(f)});
const lerBin  =f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=er;r.readAsArrayBuffer(f)});

/* Modal que devolve a escolha do usuário como promessa.
   Fica em window de propósito: os onclick embutidos nos botões só enxergam
   propriedades do objeto global, não declarações com let/const.            */
function perguntar(html,opcoes){
  return new Promise(res=>{
    window.__resp=v=>{ window.__resp=null; closeModal(); res(v); };
    modal(html+opcoes.map(o=>
      `<button class="btn ${o.classe||''}" style="margin-top:8px" onclick="window.__resp('${o.valor}')">${o.label}</button>`
    ).join(''));
  });
}
function tipoDo(d){
  if(d && d.tipo) return d.tipo;
  if(Array.isArray(d)) return 'contagens';
  if(d && d.contagens) return 'completo';
  if(d && d.produtos)  return 'catalogo';
  return '?';
}

async function receberArquivo(input){
  const files=[...input.files]; input.value='';
  if(!files.length) return;
  const res={cat:{novos:0,mudados:0}, lanc:{novos:0,rep:0}, aps:new Set(), subst:null, erros:[]};

  for(const f of files){
    try{
      if(/\.(xlsx|xls)$/i.test(f.name)){
        modal(`<h3>Lendo planilha…</h3><p class="tiny muted">${esc(f.name)}</p>`);
        const r=await S.mesclar(lerLancamentosXlsx(await lerBin(f)));
        res.lanc.novos+=r.novos; res.lanc.rep+=r.repetidos; r.aparelhos.forEach(a=>res.aps.add(a));
        continue;
      }
      const d=JSON.parse(await lerTexto(f));
      const tipo=tipoDo(d);

      if(tipo==='catalogo'){
        modal(`<h3>Recebendo catálogo…</h3><p class="tiny muted">${esc(f.name)}</p>`);
        const r=await aplicarCatalogo(d.produtos);
        res.cat.novos+=r.novos; res.cat.mudados+=r.mudados;
        continue;
      }

      if(tipo==='completo'){
        const temDados=S.counts.length>0;
        const modo= temDados ? await perguntar(
          `<h3>Backup completo de “${esc((d.aparelho&&d.aparelho.nome)||'outro aparelho')}”</h3>
           <p class="tiny muted" style="margin:0 0 4px">
             ${(d.produtos||[]).length} produtos · ${(d.contagens||[]).length} lançamentos
             ${d.exportadoEm? `· gerado em ${dt(new Date(d.exportadoEm).getTime())}`:''}</p>
           <p class="tiny muted">Este aparelho já tem <b>${S.counts.length}</b> lançamento(s). O que fazer?</p>`,
          [{label:'➕ Somar ao que já existe aqui', valor:'somar', classe:'pri'},
           {label:'🔄 Substituir tudo (mudar de aparelho)', valor:'subst', classe:'dg'},
           {label:'Cancelar este arquivo', valor:'nada', classe:'gh'}]
        ) : 'subst';

        if(modo==='nada') continue;
        if(modo==='subst'){
          modal('<h3>Transferindo…</h3><p class="tiny muted">Substituindo os dados deste aparelho.</p>');
          res.subst=await restaurarCompleto(d);
          continue;
        }
        modal(`<h3>Somando…</h3><p class="tiny muted">${esc(f.name)}</p>`);
        const rc=await aplicarCatalogo(d.produtos);
        res.cat.novos+=rc.novos; res.cat.mudados+=rc.mudados;
        const r=await S.mesclar(d.contagens||[]);
        res.lanc.novos+=r.novos; res.lanc.rep+=r.repetidos; r.aparelhos.forEach(a=>res.aps.add(a));
        continue;
      }

      if(tipo==='contagens'){
        const r=await S.mesclar(Array.isArray(d)?d:d.contagens);
        res.lanc.novos+=r.novos; res.lanc.rep+=r.repetidos; r.aparelhos.forEach(a=>res.aps.add(a));
        continue;
      }
      res.erros.push(`${f.name}: formato não reconhecido`);
    }catch(err){ console.error(err); res.erros.push(`${f.name}: ${err.message||'erro ao ler'}`); }
  }

  const linhas=[];
  if(res.subst) linhas.push(`<b style="color:var(--ok)">Aparelho transferido.</b> Agora com ${res.subst.produtos} produtos e ${res.subst.contagens} lançamentos.`);
  if(res.cat.novos||res.cat.mudados)
    linhas.push(`Catálogo: <b style="color:var(--ok)">${res.cat.novos}</b> produto(s) novo(s), <b>${res.cat.mudados}</b> atualizado(s).`);
  if(res.lanc.novos||res.lanc.rep)
    linhas.push(`Contagens: <b style="color:var(--ok)">${res.lanc.novos}</b> somada(s), <b>${res.lanc.rep}</b> já existiam e foram ignoradas.`);
  if(res.aps.size) linhas.push(`Aparelhos recebidos: ${[...res.aps].map(esc).join(', ')}`);
  res.erros.forEach(e=>linhas.push(`<span style="color:#ff6b81">${esc(e)}</span>`));
  if(!linhas.length) linhas.push('Nada novo — este aparelho já estava em dia.');

  closeModal();
  modal(`<h3>${res.erros.length?'Recebimento concluído com avisos':'✓ Recebimento concluído'}</h3>
    <p class="tiny muted" style="margin:0 0 6px;line-height:1.8">${linhas.join('<br>')}</p>
    <button class="btn pri" style="margin-top:14px" onclick="closeModal();render()">Ver resultado</button>`);
  render();
}
// lê a aba LANÇAMENTOS de uma planilha gerada por este app
function lerLancamentosXlsx(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const nome=wb.SheetNames.find(n=>/LAN[ÇC]AMENTOS/i.test(n));
  if(!nome) throw new Error('sem aba LANÇAMENTOS');
  // raw:true é essencial: com raw:false o SheetJS devolve "10.000" (padrão americano)
  // para 10 KG, e o ponto seria lido como separador de milhar.
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:'',raw:true});
  const hi=rows.findIndex(r=>r.some(c=>/^c[óo]digo$/i.test(String(c).trim())));
  if(hi<0) throw new Error('cabeçalho não encontrado');
  const H=rows[hi].map(c=>String(c).trim().toUpperCase());
  const ix=n=>H.indexOf(n);
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const cod=String(r[ix('CÓDIGO')]??'').trim();
    if(!cod || /^TOTAL/i.test(cod) || /^TOTAL/i.test(String(r[0]))) continue;
    const [d,m,y]=String(r[ix('DATA')]).split('/');
    const [hh,mm,ss]=String(r[ix('HORA')]).split(':');
    const ts=new Date(+y,+m-1,+d,+hh||0,+mm||0,+ss||0).getTime();
    out.push({uid:String(r[ix('ID')]||'').trim()||null, dev:String(r[ix('APARELHO')]||'importado').trim(),
      codigo:cod, nome:String(r[ix('PRODUTO')]||''), un:String(r[ix('UN')]||'UN').toUpperCase(),
      fam:String(r[ix('FAMÍLIA')]||''), dep:String(r[ix('DEPARTAMENTO')]||''),
      qtd:parseNum(r[ix('QUANTIDADE')]),
      pecas:Math.round(parseNum(r[ix('PEÇAS')]))||1,
      usuario:String(r[ix('USUÁRIO')]||'—'), ts});
  }
  return out;
}

/* Detector de leitor de código de barras.
   Com o produto travado na tela o cursor fica no campo de quantidade — se o operador
   dispara o leitor ali, os dígitos cairiam no peso. Leitores digitam muito rápido
   (< 45ms por caractere), então uma rajada longa e veloz é reconhecida como leitura,
   os caracteres são desfeitos do campo e o app troca de produto sozinho. */
const SCAN={buf:'',t0:0,last:0,el:null,pre:''};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && VIEW==='count' && CUR){ limpar(); return; }
  const now=Date.now();
  if(/^[0-9]$/.test(e.key)){
    if(now-SCAN.last>60){                       // início de uma nova rajada
      SCAN.buf=''; SCAN.t0=now; SCAN.el=document.activeElement;
      SCAN.pre = (SCAN.el && 'value' in SCAN.el)? SCAN.el.value : '';
    }
    SCAN.buf+=e.key; SCAN.last=now;
    return;
  }
  if(e.key==='Enter' || e.key==='Tab'){
    const n=SCAN.buf.length, veloz = n>=8 && (now-SCAN.t0) < n*45;
    const noCampoErrado = SCAN.el && SCAN.el.id && SCAN.el.id!=='cod';
    if(veloz && noCampoErrado && VIEW==='count'){
      e.preventDefault(); e.stopPropagation();
      if('value' in SCAN.el) SCAN.el.value=SCAN.pre;   // desfaz o que o leitor digitou
      const code=SCAN.buf; SCAN.buf='';
      lookup(code);
      return;
    }
  }
  if(e.key.length===1 || e.key==='Enter' || e.key==='Tab') SCAN.buf='';
},true);
